name: Pages

# Publishes the app in deploy/ to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# deploy/ is the only copy of the app; tests (*.mjs) are not published.
on:
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Design rules (no broken publish)
        run: node deploy/test_design_system.mjs
      - name: Assemble site without tests
        run: |
          cp -r deploy _site
          find _site -name '*.mjs' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
