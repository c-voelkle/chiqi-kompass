<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12294B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1A2E" media="(prefers-color-scheme: dark)">
<title>CH-IQI Kompass</title>
<link rel="icon" href="ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui/kompass.css">
</head>
<body class="k-body k-frame-layout">
<header class="k-shell">
  <a class="k-brand" href="#cockpit">
    <svg class="k-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.75"/><g transform="rotate(35 12 12)"><path d="M12 4.6 14.3 12H9.7Z" class="k-mark__needle"/><path d="M9.7 12h4.6L12 19.4Z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></g></svg>
    CH-IQI Kompass
  </a>
  <nav id="tabs" class="k-tabs" aria-label="Bereiche">
    <a class="k-tab" href="#cockpit" data-page="cockpit">Cockpit QIP 2024</a>
    <a class="k-tab" href="#chiqi" data-page="chiqi">Unterjährige Auswertung <span class="k-proto">Beta</span></a>
  </nav>
  <div class="k-shell__end">
    <span class="k-proto">Prototyp</span>
    <a class="k-shell__link" href="mailto:curtis.voelkle@gmail.com?subject=CH-IQI%20Kompass">Feedback</a>
  </div>
</header>
<iframe id="frame" class="k-frame" title="CH-IQI Kompass Inhalt"></iframe>
<script>
(function () {
  var PAGES = {
    cockpit: { src: 'cockpit.html', titel: 'CH-IQI Kompass: Cockpit QIP 2024' },
    chiqi:   { src: 'chiqi/index.html', titel: 'CH-IQI Kompass: Unterjährige Auswertung (Beta)' }
  };
  var frame = document.getElementById('frame');
  var links = document.querySelectorAll('#tabs a');
  function show() {
    var key = (location.hash || '#cockpit').slice(1);
    if (key === 'spiges') key = 'chiqi';
    if (!PAGES[key]) key = 'cockpit';
    var page = PAGES[key];
    if (frame.getAttribute('src') !== page.src) frame.setAttribute('src', page.src);
    document.title = page.titel;
    links.forEach(function (a) {
      if (a.getAttribute('data-page') === key) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }
  window.addEventListener('hashchange', show);
  // file:// iframe origins are opaque: use a tightly scoped navigation
  // message instead of allowing a child to access the parent's Location.
  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow || !event.data || event.data.type !== 'chiqi:navigate') return;
    if (event.data.page !== 'cockpit' && event.data.page !== 'chiqi') return;
    location.hash = event.data.page;
  });
  show();
})();
</script>
</body>
</html>
